name: Build & Release iOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g. v2.0.15)'
        required: false

jobs:
  build-ios:
    name: Build iOS IPA (unsigned, para Sideloadly)
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── Flutter ───────────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
          cache: true

      # ── Firebase config (secrets) ─────────────────────────────────────────
      - name: Restore GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO: ${{ secrets.GOOGLE_SERVICE_INFO_IOS }}
        run: printf '%s' "$GOOGLE_SERVICE_INFO" > ios/Runner/GoogleService-Info.plist

      - name: Restore firebase_options.dart
        env:
          FIREBASE_OPTIONS: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: printf '%s' "$FIREBASE_OPTIONS" > lib/core/firebase_options.dart

      # ── Build (sin firma; Sideloadly re-firma con tu Apple ID) ────────────
      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS app (no codesign)
        run: flutter build ios --release --no-codesign

      # ── Empaquetar .app en un IPA sin firmar ──────────────────────────────
      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qr Miru-unsigned.ipa Payload
          mkdir -p "$GITHUB_WORKSPACE/build/ios/ipa"
          mv Miru-unsigned.ipa "$GITHUB_WORKSPACE/build/ios/ipa/"
          ls -la "$GITHUB_WORKSPACE/build/ios/ipa/"

      # ── Upload artifact ───────────────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miru-iOS-IPA
          path: build/ios/ipa/*.ipa
          retention-days: 30

      # ── GitHub Release (siempre, público, descargable sin login) ────────────
      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/ios/ipa/*.ipa
          tag_name: ios-latest
          name: "Miru iOS (unsigned) — para Sideloadly"
          body: |
            IPA sin firmar generado automáticamente. Instalar con **Sideloadly** o **AltStore**.

            Build: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build & Release iOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g. v2.0.15)'
        required: false

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── Flutter ───────────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      # ── Firebase config (secrets) ─────────────────────────────────────────
      - name: Restore GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO: ${{ secrets.GOOGLE_SERVICE_INFO_IOS }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_INFO" | base64 -D > ios/Runner/GoogleService-Info.plist

      - name: Restore firebase_options.dart
        env:
          FIREBASE_OPTIONS: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          printf '%s' "$FIREBASE_OPTIONS" | base64 -D > lib/core/firebase_options.dart

      # ── Signing (certificado de desarrollo auto-firmado para Sideloadly) ──
      - name: Create self-signed development certificate
        run: |
          # Genera un certificado de desarrollo temporal para firmar el IPA.
          # Sideloadly re-firmará con el Apple ID del usuario al instalar.
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD="ci-keychain-$(openssl rand -hex 8)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Certificado auto-firmado iPhone Developer
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/key.pem -out /tmp/cert.pem \
            -days 365 -nodes \
            -subj "/CN=iPhone Developer: Miru CI/O=Miru/C=US"
          openssl pkcs12 -export -out /tmp/dev.p12 \
            -inkey /tmp/key.pem -in /tmp/cert.pem -passout pass:ci123
          security import /tmp/dev.p12 -P "ci123" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Flutter pub get
        run: flutter pub get

      - name: Build IPA
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist

      # ── Upload artifact ───────────────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miru-iOS-IPA
          path: build/ios/ipa/*.ipa
          retention-days: 30

      # ── GitHub Release ────────────────────────────────────────────────────
      - name: Create / update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ios/ipa/*.ipa
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Cleanup keychain ──────────────────────────────────────────────────
      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
